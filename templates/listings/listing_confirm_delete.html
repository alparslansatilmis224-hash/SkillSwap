{% extends 'base.html' %}

{% block title %}İlanı Sil - SkillSwap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl text-center">
        
        <div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </div>

        <h2 class="text-xl font-extrabold text-slate-900">İlanı Silmek İstiyor musunuz?</h2>
        <p class="text-xs text-slate-500 mt-2">
            "<strong class="text-slate-700">{{ object.title }}</strong>" başlıklı yetenek ilanınız ve bu ilana bağlı olan tüm takas teklifleri kalıcı olarak silinecektir.
        </p>

        <form method="post" class="mt-8 flex items-center justify-center space-x-3">
            {% csrf_token %}
            <a href="{% url 'profile' %}" class="w-1/2 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-bold text-xs hover:bg-slate-50 transition">
                Vazgeç
            </a>
            <button type="submit" class="w-1/2 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-md transition">
                Evet, Sil
            </button>
        </form>

    </div>
</div>
{% endblock %}
